# Runs the SAME script as the local hooks: what passes locally passes in CI,
# and commits whose hooks were skipped (--no-verify) or never installed are caught here.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # nightly: newly published CVEs even if the code has not changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Security checks (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/security.sh check --base "${BASE_SHA:-auto}"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vulnerability scan of all dependencies
        run: bash scripts/security/security.sh deps --full
