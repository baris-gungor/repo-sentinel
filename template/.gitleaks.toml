# Gitleaks configuration — default rules + project-specific additions.
# To ignore a specific finding, add its fingerprint to .gitleaksignore
# or put a "gitleaks:allow" comment at the end of the line (with a reason).
[extend]
useDefault = true

[[allowlists]]
description = "Test data and snapshots"
paths = ['''(^|/)(testdata|fixtures|__snapshots__)/''']

